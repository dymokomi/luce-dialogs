name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    env:
      LUCE_TEST_GPU: optional
      LUCE_TEST_WINDOW: optional
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-dialogs
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luce-dialogs
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build the compiler
        working-directory: luce-base
        run: ./build.sh
      - name: Package gate
        working-directory: luce-dialogs
        run: ./test.sh
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-dialogs-${{ matrix.runner }}-${{ github.sha }}
          path: |
            luce-dialogs/build/*.log
            luce-dialogs/build/failures/
          if-no-files-found: ignore
